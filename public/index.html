<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocha Test Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-pass .stat-number {
            color: #22c55e;
        }

        .stat-fail .stat-number {
            color: #ef4444;
        }

        .stat-pending .stat-number {
            color: #f59e0b;
        }

        .stat-duration .stat-number {
            color: #3b82f6;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: white;
            color: #667eea;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tests-container {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tests-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5em;
        }

        .test-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #ccc;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .test-item:hover {
            background: #f9f9f9;
        }

        .test-item.pass {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }

        .test-item.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .test-item.pending {
            border-left-color: #f59e0b;
            background: #fffbf0;
        }

        .test-status {
            font-size: 1.2em;
            margin-right: 15px;
            width: 25px;
            text-align: center;
        }

        .test-pass .test-status::before {
            content: "✓";
            color: #22c55e;
            font-weight: bold;
        }

        .test-fail .test-status::before {
            content: "✕";
            color: #ef4444;
            font-weight: bold;
        }

        .test-pending .test-status::before {
            content: "○";
            color: #f59e0b;
            font-weight: bold;
        }

        .test-title {
            flex: 1;
            color: #333;
            font-weight: 500;
        }

        .test-time {
            color: #999;
            font-size: 0.9em;
            min-width: 60px;
            text-align: right;
        }

        .test-suite {
            color: #667eea;
            font-weight: bold;
            font-size: 0.85em;
            background: #f0f4ff;
            padding: 2px 8px;
            border-radius: 3px;
            margin-right: 10px;
        }

        .error-message {
            background: #fef2f2;
            color: #ef4444;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e 0%, #3b82f6 50%, #22c55e 100%);
            width: 0%;
            animation: progress 0.3s ease;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-tab {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-tab:hover {
            border-color: #667eea;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .test-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .test-list::-webkit-scrollbar {
            width: 8px;
        }

        .test-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .test-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .no-tests {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-tests p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Mocha Test Viewer</h1>
            <p>Real-time test execution and results dashboard</p>
        </header>

        <div class="controls">
            <button id="runTestsBtn" onclick="runTests()">
                ▶️ Run Tests
            </button>
            <button id="refreshBtn" onclick="fetchTests()">
                🔄 Refresh
            </button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="card stat-card stat-pass">
                <div class="stat-label">Passed</div>
                <div class="stat-number" id="passCount">-</div>
            </div>
            <div class="card stat-card stat-fail">
                <div class="stat-label">Failed</div>
                <div class="stat-number" id="failCount">-</div>
            </div>
            <div class="card stat-card stat-pending">
                <div class="stat-label">Pending</div>
                <div class="stat-number" id="pendingCount">-</div>
            </div>
            <div class="card stat-card stat-duration">
                <div class="stat-label">Duration</div>
                <div class="stat-number" id="duration">-</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="tests-container">
            <h2>Test Results</h2>
            
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterTests('all')">All</button>
                <button class="filter-tab" onclick="filterTests('pass')">✓ Passed</button>
                <button class="filter-tab" onclick="filterTests('fail')">✕ Failed</button>
                <button class="filter-tab" onclick="filterTests('pending')">○ Pending</button>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div class="test-list" id="testList">
                <div class="no-tests">
                    <p>📋 No tests loaded yet</p>
                    <p>Click "Run Tests" to start</p>
                </div>
            </div>

            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let allTests = [];

        async function runTests() {
            const btn = document.getElementById('runTestsBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Running Tests...';

            try {
                const response = await fetch('/api/tests');
                const data = await response.json();

                if (data.success) {
                    allTests = data.tests || [];
                    updateDashboard(data);
                    displayTests(allTests);
                    showError(null);
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Failed to run tests: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '▶️ Run Tests';
            }
        }

        async function fetchTests() {
            try {
                const response = await fetch('/api/tests');
                const data = await response.json();

                if (data.success) {
                    allTests = data.tests || [];
                    updateDashboard(data);
                    displayTests(allTests);
                    showError(null);
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Failed to fetch tests: ' + error.message);
            }
        }

        function updateDashboard(data) {
            document.getElementById('passCount').textContent = data.passes;
            document.getElementById('failCount').textContent = data.failures;
            document.getElementById('pendingCount').textContent = data.pending;
            document.getElementById('duration').textContent = data.duration + 'ms';

            const total = data.passes + data.failures + data.pending;
            const passPercentage = total > 0 ? (data.passes / total) * 100 : 0;
            document.getElementById('progressFill').style.width = passPercentage + '%';

            const date = new Date(data.timestamp);
            document.getElementById('timestamp').textContent = 
                `Last updated: ${date.toLocaleString()}`;
        }

        function displayTests(tests) {
            const testList = document.getElementById('testList');
            
            if (!tests || tests.length === 0) {
                testList.innerHTML = '<div class="no-tests"><p>No tests found</p></div>';
                return;
            }

            let html = '';
            tests.forEach(test => {
                const status = getTestStatus(test);
                if (currentFilter !== 'all' && currentFilter !== status) {
                    return;
                }

                const title = test.fullTitle || test.title;
                const duration = test.duration ? test.duration + 'ms' : '-';
                const statusClass = `test-item test-${status}`;

                html += `
                    <div class="${statusClass}">
                        <div class="test-status"></div>
                        <div class="test-title">${title}</div>
                        <div class="test-time">${duration}</div>
                    </div>
                `;
            });

            testList.innerHTML = html || '<div class="no-tests"><p>No tests match filter</p></div>';
        }

        function getTestStatus(test) {
            if (test.pending) return 'pending';
            if (test.err && Object.keys(test.err).length > 0) return 'fail';
            return 'pass';
        }

        function filterTests(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            displayTests(allTests);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (message) {
                errorDiv.textContent = '❌ ' + message;
                errorDiv.classList.add('show');
            } else {
                errorDiv.classList.remove('show');
            }
        }

        // Load tests on page load
        window.addEventListener('load', () => {
            fetchTests();
        });

        // Auto-refresh every 10 seconds
        setInterval(fetchTests, 10000);
    </script>
</body>
</html>
